name: Verify and Build Android v2.2.0

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Build strict signed Google Play AAB'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-debug:
    name: Verify + Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Using project checked into repository root."
          else
            ZIP_COUNT=$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)
            if [ "$ZIP_COUNT" -ne 1 ]; then
              echo "ERROR: No root Gradle project found and expected exactly one ZIP, found: $ZIP_COUNT"
              find . -maxdepth 1 -type f -name '*.zip' -print || true
              exit 1
            fi
            ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
            echo "Using ZIP: $ZIP_FILE"
            rm -rf extracted
            mkdir extracted
            unzip -q "$ZIP_FILE" -d extracted
            PROJECT_DIR=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle/settings.gradle.kts not found inside ZIP."
              exit 1
            fi
            PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Materialize optional Firebase config for debug
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            echo "Firebase Android config materialized for debug validation."
          else
            echo "Firebase config not set. Debug verification continues with FCM inactive."
          fi

      - name: Static production regression checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          node scripts/regression-check.mjs

      - name: Unit tests + Lint + Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug

      - name: Collect debug reports
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output
          if [ -n "${PROJECT_DIR:-}" ]; then
            cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ci-output/Al-Muslim-v2.2.0-debug.apk 2>/dev/null || true
            cp -r "$PROJECT_DIR/app/build/reports/tests" ci-output/tests 2>/dev/null || true
            cp -r "$PROJECT_DIR/app/build/reports/lint-results"* ci-output/ 2>/dev/null || true
          fi

      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Al-Muslim-v2.2.0-Debug-CI
          path: ci-output/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Strict Production Release AAB
    needs: verify-debug
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_COUNT=$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)
            if [ "$ZIP_COUNT" -ne 1 ]; then
              echo "ERROR: No root Gradle project found and expected exactly one ZIP, found: $ZIP_COUNT"
              exit 1
            fi
            ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
            rm -rf extracted
            mkdir extracted
            unzip -q "$ZIP_FILE" -d extracted
            PROJECT_DIR=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle/settings.gradle.kts not found inside ZIP."
              exit 1
            fi
            PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Require Firebase config for production
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 is required for a production release."
            exit 1
          fi
          cd "$PROJECT_DIR"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Require signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ALMUSLIM_KEYSTORE_BASE64 }}
          ALMUSLIM_KEYSTORE_PASSWORD: ${{ secrets.ALMUSLIM_KEYSTORE_PASSWORD }}
          ALMUSLIM_KEY_ALIAS: ${{ secrets.ALMUSLIM_KEY_ALIAS }}
          ALMUSLIM_KEY_PASSWORD: ${{ secrets.ALMUSLIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${ALMUSLIM_KEYSTORE_PASSWORD:-}" ] || [ -z "${ALMUSLIM_KEY_ALIAS:-}" ] || [ -z "${ALMUSLIM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Release signing secrets are missing."
            exit 1
          fi
          export ALMUSLIM_KEYSTORE_PATH="$RUNNER_TEMP/al-muslim-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ALMUSLIM_KEYSTORE_PATH"
          echo "ALMUSLIM_KEYSTORE_PATH=$ALMUSLIM_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Production regression checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          node scripts/regression-check.mjs

      - name: Tests + Release Lint + Signed AAB
        shell: bash
        env:
          ALMUSLIM_KEYSTORE_PASSWORD: ${{ secrets.ALMUSLIM_KEYSTORE_PASSWORD }}
          ALMUSLIM_KEY_ALIAS: ${{ secrets.ALMUSLIM_KEY_ALIAS }}
          ALMUSLIM_KEY_PASSWORD: ${{ secrets.ALMUSLIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest lintRelease bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/release-output/Al-Muslim-v2.2.0-release.aab"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "${ALMUSLIM_KEYSTORE_PATH:-}" || true

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v6
        with:
          name: Al-Muslim-v2.2.0-Release-AAB
          path: release-output/Al-Muslim-v2.2.0-release.aab
          if-no-files-found: error
          retention-days: 30
