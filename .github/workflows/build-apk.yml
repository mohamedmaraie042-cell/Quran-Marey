name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "Using: $ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -printf '%h\n' | head -1)
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-output/Quran-Marey-v1.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Marey-APK
          path: apk-output/Quran-Marey-v1.2.apk
